plugins {
    id 'java'
    // Helps to run from main on dev
    id 'application'
    id 'idea'
    // Protobuf plugin
    id "com.google.protobuf" version "0.9.2"
}

group 'org.ssd'
version '1.0-SNAPSHOT'
mainClassName = 'org.ssd.DHT'

repositories {
    mavenLocal()
    mavenCentral()
}

def grpcVersion = '1.53.0'
def protobufVersion = '3.21.12'
def protocVersion = protobufVersion

dependencies {
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"
    implementation 'com.google.code.gson:gson:2.10.1'
    //Gradle gives error without this dependency
    // https://mavenlibs.com/maven/dependency/javax.annotation/javax.annotation-api
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // Netty
    // https://mavenlibs.com/maven/dependency/io.grpc/grpc-netty-shaded
    runtimeOnly "io.grpc:grpc-netty-shaded:${grpcVersion}"
    // https://mavenlibs.com/maven/dependency/io.grpc/grpc-netty
    implementation "io.grpc:grpc-netty:${grpcVersion}"

    // CRYPTO
    // https://mavenlibs.com/maven/dependency/org.bouncycastle/bcprov-jdk15on
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    // https://mavenlibs.com/maven/dependency/org.bouncycastle/bcpkix-jdk15on
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'

    // Instead of JavaX annotations (for equals) https://github.com/gunnarmorling/awesome-annotation-processing#related-concepts
    compileOnly 'org.projectlombok:lombok:1.18.26'
    annotationProcessor 'org.projectlombok:lombok:1.18.26'
    testCompileOnly 'org.projectlombok:lombok:1.18.26'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.26'

    //Logging
    implementation platform('org.apache.logging.log4j:log4j-bom:2.20.0')

    implementation 'org.apache.logging.log4j:log4j-api'
    runtimeOnly 'org.apache.logging.log4j:log4j-core'
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
        resources {
            srcDirs 'src/main/resources'
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClassName
    }
}

test {
    useJUnitPlatform()
}